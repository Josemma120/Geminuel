<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="gradM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#3a7dff" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#a81a66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a81a66" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sphereBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="80%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="150" fill="url(#glow)" />
  <circle cx="200" cy="200" r="115" fill="#222222" />
  <circle cx="200" cy="200" r="110" fill="url(#sphereBase)" />
  <ellipse cx="200" cy="130" rx="80" ry="40" fill="url(#glassReflection)" />
  <text
    x="200"
    y="250"
    font-family="Arial, Helvetica, sans-serif"
    font-size="140"
    font-weight="bold"
    fill="url(#gradM)"
    text-anchor="middle"
  >
    M
  </text>
</svg>
