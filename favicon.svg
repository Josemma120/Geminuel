<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Orb Radial Gradient -->
    <radialGradient id="orbGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a324b"/>
      <stop offset="55%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    
    <!-- Neon Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ab4f8"/>
      <stop offset="50%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#c58af9"/>
    </linearGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ab4f8"/>
      <stop offset="100%" stop-color="#c58af9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.95"/>

  <!-- Inner 3D Sphere -->
  <circle cx="32" cy="32" r="28" fill="url(#orbGrad)"/>
  
  <!-- Specular Dome Highlight -->
  <path d="M 12,24 C 18,13 46,13 52,24 C 44,18 20,18 12,24 Z" fill="white" opacity="0.28"/>

  <!-- Centered Hero Monogram G -->
  <text x="32" y="44.5" 
        font-family="'Consolas', 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" 
        font-size="38" 
        font-weight="900" 
        fill="url(#glyphGrad)" 
        text-anchor="middle"
        filter="url(#glow)">G</text>
</svg>
